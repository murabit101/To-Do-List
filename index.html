<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="To-Do List - Practical Frontend Project - HTML | CSS | JavaScript" />
    <title>To Do List</title>
    <link rel="icon" type="icon" href="imgs/icon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Main Container -->
    <div class="todo-container">
      <!-- Add Task Section -->
      <div class="add-task">
        <input type="text">
        <i class="add-btn fa-solid fa-plus"></i>
      </div>
      <!-- Tasks Content Box -->
      <div class="task-content">
        <span class="no-tasks-message">No Task To Show</span>
      </div>
      <!-- Stats Box -->
      <div class="tasks-stats">
        <div class="tasks-count">
          Tasks <span>0</span>
        </div>
        <div class="tasks-completed">
          Completed <span>0</span>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
